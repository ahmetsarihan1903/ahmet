<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 650" width="100%" height="100%" style="background: #ffffff;">
  <defs>
    <!-- Concrete Hatch Pattern -->
    <pattern id="concreteHatchRear" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45 0 0)">
      <path d="M 0,0 L 0,16 M 8,0 L 8,16" stroke="#475569" strokeWidth="1" />
      <circle cx="4" cy="4" r="1" fill="#334155" />
      <circle cx="12" cy="12" r="1" fill="#334155" />
    </pattern>
    <marker id="arrowRedRear" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="325" y="30" fill="#0f172a" fontSize="16" fontWeight="900" textAnchor="middle" font-family="sans-serif">AĞIRLIK ARKADA - TEKNİK PROJE ÇİZİMİ</text>

  <!-- Outer Concrete Wall -->
  <rect x="50" y="50" width="550" height="520" fill="url(#concreteHatchRear)" stroke="#0f172a" strokeWidth="3" />
  <!-- Inner Shaft White Space -->
  <rect x="110" y="100" width="430" height="420" fill="#ffffff" stroke="#0f172a" strokeWidth="3" />

  <!-- Centerlines -->
  <line x1="325" y1="80" x2="325" y2="540" stroke="#ec4899" strokeWidth="1.2" strokeDasharray="8 4 2 4" />
  <line x1="90" y1="310" x2="560" y2="310" stroke="#ec4899" strokeWidth="1.2" strokeDasharray="8 4 2 4" />

  <!-- Rear Counterweight Assembly (At Top / Back Wall) -->
  <rect x="185" y="125" width="280" height="40" fill="none" stroke="#0284c7" strokeWidth="2" stroke-dasharray="6 4" />
  <!-- CWT Guides at Rear Wall -->
  <g transform="translate(235, 125)">
    <path d="M -15,0 L -15,18 L -5,18 L -5,8 L 15,8 L 15,-2 L -5,-2 L -5,0 Z" fill="#22d3ee" stroke="#0891b2" strokeWidth="2" />
  </g>
  <g transform="translate(415, 125)">
    <path d="M 15,0 L 15,18 L 5,18 L 5,8 L -15,8 L -15,-2 L 5,-2 L 5,0 Z" fill="#22d3ee" stroke="#0891b2" strokeWidth="2" />
  </g>
  <text x="325" y="150" fill="#0284c7" fontSize="12" fontWeight="bold" textAnchor="middle">KARŞI AĞIRLIK (CWT)</text>

  <!-- Left Cabin Guide (T-Profile) -->
  <g transform="translate(170, 310)">
    <path d="M 0,-15 L 25,-15 L 25,-5 L 12,-5 L 12,15 L 2,15 L 2,-5 L 0,-5 Z" fill="#22d3ee" stroke="#0891b2" strokeWidth="2" />
  </g>

  <!-- Right Cabin Guide (T-Profile) -->
  <g transform="translate(480, 310)">
    <path d="M 0,-15 L -25,-15 L -25,-5 L -12,-5 L -12,15 L -2,15 L -2,-5 L 0,-5 Z" fill="#22d3ee" stroke="#0891b2" strokeWidth="2" />
  </g>

  <!-- Cabin Body Box -->
  <rect x="195" y="195" width="260" height="270" fill="none" stroke="#0284c7" strokeWidth="2" />
  <text x="325" y="325" fill="#0284c7" fontSize="14" fontWeight="bold" textAnchor="middle">KABİN</text>

  <!-- Entrance Door at Bottom Center -->
  <rect x="220" y="500" width="210" height="20" fill="#f8fafc" stroke="#0f172a" strokeWidth="2" />
  <rect x="240" y="505" width="25" height="25" fill="#e2e8f0" stroke="#0f172a" strokeWidth="1.5" />
  <rect x="385" y="505" width="25" height="25" fill="#e2e8f0" stroke="#0f172a" strokeWidth="1.5" />

  <!-- DIMENSIONS & NUMBERS (1 to 15 matching Rear-CWT layout) -->
  <!-- 1: Left guide height from floor -->
  <line x1="182" y1="325" x2="182" y2="500" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRedRear)" marker-end="url(#arrowRedRear)" />
  <circle cx="182" cy="410" r="10" fill="#2563eb" />
  <text x="182" y="414" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">1</text>

  <!-- 2: Right guide height from floor -->
  <line x1="468" y1="325" x2="468" y2="500" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRedRear)" marker-end="url(#arrowRedRear)" />
  <circle cx="468" cy="410" r="10" fill="#2563eb" />
  <text x="468" y="414" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">2</text>

  <!-- 3: Left CWT guide distance from rear wall -->
  <line x1="235" y1="100" x2="235" y2="125" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRedRear)" marker-end="url(#arrowRedRear)" />
  <circle cx="235" cy="112" r="10" fill="#2563eb" />
  <text x="235" y="116" fill="#ffffff" fontSize="10" fontWeight="bold" textAnchor="middle">3</text>

  <!-- 4: Right CWT guide distance from rear wall -->
  <line x1="415" y1="100" x2="415" y2="125" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRedRear)" marker-end="url(#arrowRedRear)" />
  <circle cx="415" cy="112" r="10" fill="#2563eb" />
  <text x="415" y="116" fill="#ffffff" fontSize="10" fontWeight="bold" textAnchor="middle">4</text>

  <!-- 5: Diagonal from left door to right guide -->
  <line x1="182" y1="325" x2="385" y2="500" stroke="#ef4444" strokeWidth="1.2" marker-start="url(#arrowRedRear)" marker-end="url(#arrowRedRear)" />
  <circle cx="283" cy="412" r="10" fill="#2563eb" />
  <text x="283" y="416" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">5</text>

  <!-- 6: Diagonal from right door to left guide -->
  <line x1="468" y1="325" x2="240" y2="500" stroke="#ef4444" strokeWidth="1.2" marker-start="url(#arrowRedRear)" marker-end="url(#arrowRedRear)" />
  <circle cx="354" cy="412" r="10" fill="#2563eb" />
  <text x="354" y="416" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">6</text>

  <!-- 7: Cabin DBG (Distance between cabin guides) -->
  <line x1="182" y1="285" x2="468" y2="285" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRedRear)" marker-end="url(#arrowRedRear)" />
  <circle cx="325" cy="285" r="10" fill="#2563eb" />
  <text x="325" y="289" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">7</text>

  <!-- 8: CWT DBG (Distance between CWT guides) -->
  <line x1="235" y1="145" x2="415" y2="145" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRedRear)" marker-end="url(#arrowRedRear)" />
  <circle cx="325" cy="145" r="10" fill="#2563eb" />
  <text x="325" y="149" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">8</text>

  <!-- 9: Door center offset from centerline -->
  <line x1="310" y1="535" x2="325" y2="535" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRedRear)" marker-end="url(#arrowRedRear)" />
  <circle cx="317" cy="535" r="10" fill="#2563eb" />
  <text x="317" y="539" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">9</text>

  <!-- 10: Clearance from rear wall to cabin -->
  <line x1="130" y1="100" x2="130" y2="195" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRedRear)" marker-end="url(#arrowRedRear)" />
  <circle cx="130" cy="147" r="10" fill="#2563eb" />
  <text x="130" y="151" fill="#ffffff" fontSize="10" fontWeight="bold" textAnchor="middle">10</text>

  <!-- 11: Distance from left wall to left guide -->
  <line x1="110" y1="310" x2="170" y2="310" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRedRear)" marker-end="url(#arrowRedRear)" />
  <circle cx="140" cy="310" r="10" fill="#2563eb" />
  <text x="140" y="314" fill="#ffffff" fontSize="10" fontWeight="bold" textAnchor="middle">11</text>

  <!-- 12: Distance from right wall to right guide -->
  <line x1="480" y1="310" x2="540" y2="310" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRedRear)" marker-end="url(#arrowRedRear)" />
  <circle cx="510" cy="310" r="10" fill="#2563eb" />
  <text x="510" y="314" fill="#ffffff" fontSize="10" fontWeight="bold" textAnchor="middle">12</text>

  <!-- 13: Left door reveal -->
  <line x1="110" y1="535" x2="220" y2="535" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRedRear)" marker-end="url(#arrowRedRear)" />
  <circle cx="165" cy="535" r="10" fill="#2563eb" />
  <text x="165" y="539" fill="#ffffff" fontSize="10" fontWeight="bold" textAnchor="middle">13</text>

  <!-- 14: Right door reveal -->
  <line x1="430" y1="535" x2="540" y2="535" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRedRear)" marker-end="url(#arrowRedRear)" />
  <circle cx="485" cy="535" r="10" fill="#2563eb" />
  <text x="485" y="539" fill="#ffffff" fontSize="10" fontWeight="bold" textAnchor="middle">14</text>

  <!-- 15: Door sill width -->
  <line x1="240" y1="465" x2="265" y2="465" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRedRear)" marker-end="url(#arrowRedRear)" />
  <circle cx="252" cy="465" r="10" fill="#2563eb" />
  <text x="252" y="469" fill="#ffffff" fontSize="10" fontWeight="bold" textAnchor="middle">15</text>
</svg>
