<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 650" width="100%" height="100%" style="background: #ffffff;">
  <defs>
    <!-- Concrete Hatch Pattern -->
    <pattern id="concreteHatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45 0 0)">
      <path d="M 0,0 L 0,16 M 8,0 L 8,16" stroke="#475569" strokeWidth="1" />
      <circle cx="4" cy="4" r="1" fill="#334155" />
      <circle cx="12" cy="12" r="1" fill="#334155" />
    </pattern>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="325" y="30" fill="#0f172a" fontSize="16" fontWeight="900" textAnchor="middle" font-family="sans-serif">AĞIRLIK YANDA (SAĞDA) - TEKNİK PROJE ÇİZİMİ</text>

  <!-- Outer Concrete Wall -->
  <rect x="50" y="50" width="550" height="520" fill="url(#concreteHatch)" stroke="#0f172a" strokeWidth="3" />
  <!-- Inner Shaft White Space -->
  <rect x="110" y="100" width="430" height="420" fill="#ffffff" stroke="#0f172a" strokeWidth="3" />

  <!-- Centerlines -->
  <line x1="325" y1="80" x2="325" y2="540" stroke="#ec4899" strokeWidth="1.2" strokeDasharray="8 4 2 4" />
  <line x1="90" y1="310" x2="560" y2="310" stroke="#ec4899" strokeWidth="1.2" strokeDasharray="8 4 2 4" />
  <line x1="480" y1="120" x2="480" y2="500" stroke="#ec4899" strokeWidth="1" strokeDasharray="6 3" />

  <!-- Left Cabin Guide (T-Profile) -->
  <g transform="translate(160, 290)">
    <path d="M 0,-15 L 25,-15 L 25,-5 L 12,-5 L 12,15 L 2,15 L 2,-5 L 0,-5 Z" fill="#22d3ee" stroke="#0891b2" strokeWidth="2" />
  </g>

  <!-- Back Cabin Guide (T-Profile) -->
  <g transform="translate(325, 290) rotate(90)">
    <path d="M 0,-15 L 25,-15 L 25,-5 L 12,-5 L 12,15 L 2,15 L 2,-5 L 0,-5 Z" fill="#22d3ee" stroke="#0891b2" strokeWidth="2" />
  </g>

  <!-- Right Counterweight Assembly (T-Guides & Weight Stack) -->
  <!-- Top CWT Guide -->
  <g transform="translate(480, 150)">
    <path d="M -12,-15 L 13,-15 L 13,-5 L 3,-5 L 3,15 L -7,15 L -7,-5 L -12,-5 Z" fill="#22d3ee" stroke="#0891b2" strokeWidth="2" />
  </g>
  <!-- Bottom CWT Guide -->
  <g transform="translate(480, 430)">
    <path d="M -12,15 L 13,15 L 13,5 L 3,5 L 3,-15 L -7,-15 L -7,5 L -12,5 Z" fill="#22d3ee" stroke="#0891b2" strokeWidth="2" />
  </g>
  <!-- Counterweight Frame / Weight Block (Dashed Box on Right) -->
  <rect x="460" y="180" width="40" height="220" fill="none" stroke="#0284c7" strokeWidth="2" stroke-dasharray="6 4" />
  <text x="480" y="295" fill="#0284c7" fontSize="11" fontWeight="bold" textAnchor="middle">CWT</text>

  <!-- Entrance Door at Bottom Center -->
  <rect x="230" y="500" width="190" height="20" fill="#f8fafc" stroke="#0f172a" strokeWidth="2" />
  <rect x="250" y="505" width="25" height="25" fill="#e2e8f0" stroke="#0f172a" strokeWidth="1.5" />
  <rect x="375" y="505" width="25" height="25" fill="#e2e8f0" stroke="#0f172a" strokeWidth="1.5" />

  <!-- DIMENSIONS & NUMBERS (1 to 15 matching user's exact drawing) -->
  <!-- 1: Left guide height from floor -->
  <line x1="172" y1="305" x2="172" y2="500" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)" />
  <circle cx="172" cy="400" r="10" fill="#2563eb" />
  <text x="172" y="404" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">1</text>

  <!-- 2: Right cabin guide height from floor -->
  <line x1="337" y1="305" x2="337" y2="500" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)" />
  <circle cx="337" cy="400" r="10" fill="#2563eb" />
  <text x="337" y="404" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">2</text>

  <!-- 3: Lower CWT guide height from floor -->
  <line x1="450" y1="445" x2="450" y2="500" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)" />
  <circle cx="450" cy="472" r="10" fill="#2563eb" />
  <text x="450" y="476" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">3</text>

  <!-- 4: CWT distance from right wall -->
  <line x1="500" y1="150" x2="550" y2="150" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)" />
  <circle cx="525" cy="150" r="10" fill="#2563eb" />
  <text x="525" y="154" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">4</text>

  <!-- 5: Diagonal from left door to right guide -->
  <line x1="172" y1="305" x2="375" y2="500" stroke="#ef4444" strokeWidth="1.2" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)" />
  <circle cx="273" cy="402" r="10" fill="#2563eb" />
  <text x="273" y="406" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">5</text>

  <!-- 6: Diagonal from right door to left guide -->
  <line x1="337" y1="305" x2="250" y2="500" stroke="#ef4444" strokeWidth="1.2" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)" />
  <circle cx="293" cy="402" r="10" fill="#2563eb" />
  <text x="293" y="406" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">6</text>

  <!-- 7: Cabin DBG (Width between side guides) -->
  <line x1="172" y1="270" x2="337" y2="270" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)" />
  <circle cx="254" cy="270" r="10" fill="#2563eb" />
  <text x="254" y="274" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">7</text>

  <!-- 8: CWT width / span -->
  <line x1="510" y1="180" x2="510" y2="400" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)" />
  <circle cx="510" cy="290" r="10" fill="#2563eb" />
  <text x="510" y="294" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">8</text>

  <!-- 9: Door center offset -->
  <line x1="310" y1="535" x2="325" y2="535" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)" />
  <circle cx="317" cy="535" r="10" fill="#2563eb" />
  <text x="317" y="539" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">9</text>

  <!-- 10: Distance from cabin guide to CWT -->
  <line x1="355" y1="290" x2="465" y2="290" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)" />
  <circle cx="410" cy="290" r="10" fill="#2563eb" />
  <text x="410" y="294" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">10</text>

  <!-- 11: Upper CWT guide distance from top -->
  <line x1="450" y1="100" x2="450" y2="150" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)" />
  <circle cx="450" cy="125" r="10" fill="#2563eb" />
  <text x="450" y="129" fill="#ffffff" fontSize="10" fontWeight="bold" textAnchor="middle">11</text>

  <!-- 12: Top clearance from wall to guide -->
  <line x1="130" y1="100" x2="130" y2="275" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)" />
  <circle cx="130" cy="187" r="10" fill="#2563eb" />
  <text x="130" y="191" fill="#ffffff" fontSize="10" fontWeight="bold" textAnchor="middle">12</text>

  <!-- 13: Left door reveal -->
  <line x1="110" y1="535" x2="230" y2="535" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)" />
  <circle cx="170" cy="535" r="10" fill="#2563eb" />
  <text x="170" y="539" fill="#ffffff" fontSize="10" fontWeight="bold" textAnchor="middle">13</text>

  <!-- 14: Right door reveal / clearance -->
  <line x1="420" y1="535" x2="550" y2="535" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)" />
  <circle cx="485" cy="535" r="10" fill="#2563eb" />
  <text x="485" y="539" fill="#ffffff" fontSize="10" fontWeight="bold" textAnchor="middle">14</text>

  <!-- 15: Door sill width -->
  <line x1="250" y1="465" x2="275" y2="465" stroke="#ef4444" strokeWidth="1.5" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)" />
  <circle cx="262" cy="465" r="10" fill="#2563eb" />
  <text x="262" y="469" fill="#ffffff" fontSize="10" fontWeight="bold" textAnchor="middle">15</text>
</svg>
